apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-primary
  namespace: microservices
  labels:
    app: order-service
    track: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: order-service
      track: stable
  template:
    metadata:
      labels:
        app: order-service
        track: stable
    spec:
      containers:
      - name: order-service
        image: order-service:v1.0.0
        ports:
        - containerPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-canary
  namespace: microservices
  labels:
    app: order-service
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
      track: canary
  template:
    metadata:
      labels:
        app: order-service
        track: canary
    spec:
      containers:
      - name: order-service
        image: order-service:v1.1.0-canary
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-canary-svc
  namespace: microservices
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: order-service
