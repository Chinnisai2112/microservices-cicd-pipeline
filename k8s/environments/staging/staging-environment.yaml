apiVersion: v1
kind: Namespace
metadata:
  name: microservices-staging
  labels:
    environment: staging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-global-config
  namespace: microservices-staging
data:
  NODE_ENV: "staging"
  LOG_LEVEL: "info"
  USER_SERVICE_URL: "http://user-service.microservices-staging.svc.cluster.local:3001"
  PRODUCT_SERVICE_URL: "http://product-service.microservices-staging.svc.cluster.local:3002"
---
apiVersion: v1
kind: Secret
metadata:
  name: staging-secrets
  namespace: microservices-staging
type: Opaque
stringData:
  JWT_SECRET: "staging-jwt-secret-key-32charsmin!"
  DATABASE_URL: "postgresql://staging_user:staging_pass@db.staging:5432/staging_db"
